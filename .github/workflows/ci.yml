name: MLOps CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  quality-test-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint
        run: ruff check src scripts tests --output-format=github
      - name: Unit and API tests
        run: pytest -q
      - name: Download dataset
        run: python scripts/download_data.py
      - name: Run EDA
        run: python scripts/eda.py
      - name: Train and track experiments
        run: python -m src.train
      - name: Upload reports and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-run-artifacts
          path: |
            artifacts/
            mlruns/
          if-no-files-found: warn
          retention-days: 14
